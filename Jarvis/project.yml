name: Jarvis
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  BASE_SDK: iphoneos
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  appmodule-local:
    path: .

targets:
  Jarvis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources/AppModule
        name: AppModuleAll
        excludes:
          - "../Scripts/**"
          - "**/*.md"
      - path: Sources/AppModule/App
        name: App
      - path: Sources/AppModule/Chat
        name: Chat
      - path: Sources/AppModule/Models
        name: Models
      - path: Sources/AppModule/Privacy
        name: Privacy
      - path: Sources/AppModule/services
        name: services
      - path: Sources/AppModule/Settings
        name: Settings
      - path: Sources/AppModule/Vision
        name: Vision
      - path: Sources/AppModule/Voice
        name: Voice
      - path: dist/bundle
        type: folder
        buildPhase: resources
        optional: true
        name: mlc-bundle

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mistico06.jarvis
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: 5.0
      ENABLE_PREVIEWS: YES
      INFOPLIST_FILE: Sources/AppModule/App/Info.plist
      LIBRARY_SEARCH_PATHS:
        - "$(inherited)"
        - "$(PROJECT_DIR)/dist/lib"
      OTHER_LDFLAGS:
        - "-Wl,-all_load"
        - "-lmlc_llm"
        - "-ltvm_runtime"
        - "-ltokenizers_cpp"
        - "-lsentencepiece"
        - "-ltokenizers_c"

    dependencies:
      - package: appmodule-local
        product: AppModule

    scheme:
      testTargets: []
      gatherCoverageData: false
